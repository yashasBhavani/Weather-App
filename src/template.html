<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <nav>
      <header>
        <button class="locationButton">location</button>
        <button class="tempToggleBtn">convert</button>
      </header>
    </nav>

    <div class="content">
      <h1>Weather Forcast</h1>
      <ul>
        <li class="address"></li>
        <li class="temp"></li>
        <li class="timezone"></li>
        <li class="description"></li>
      </ul>
    </div>

    <dialog id="dialogBox">
      <form method="dialog">
        <label for="location">Location</label>
        <input type="text" name="location" id="location" />
        <div class="button">
          <button class="exit">exit</button>
          <button class="submit">submit</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
